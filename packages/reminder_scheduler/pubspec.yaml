name: reminder_scheduler
description: >-
  Reusable local-notification reminder scheduler. Exposes a generic
  contract (ReminderRequest + triggers) so host apps map their own
  models into it — the package knows nothing about any app domain.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
