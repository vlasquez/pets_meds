name: Release

# Runs on version tags (v1.0.0, v1.1.0, ...) or manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    # Allow the job to create GitHub Releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Recreate the upload keystore from secrets. Pass the base64 via
      # env (not string interpolation) and decode tolerantly so any
      # line wrapping in the secret can't corrupt the .jks.
      - name: Set up signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks
          # Fail early with a clear message if the keystore is unreadable.
          keytool -list -keystore android/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" >/dev/null
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=../upload-keystore.jks
          EOF

      - run: flutter pub get
      # run_number guarantees a strictly increasing versionCode.
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}

      # Also build an APK for direct download from the GitHub Release
      # (an .aab can't be installed directly on a device).
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # Uploads to the Play "internal" track. Promote to production
      # from the Play Console when ready.
      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.the101labs.petmeds
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # Publish a GitHub Release for this tag, with build artifacts
      # attached. Shows up under the repo's "Releases" section, and the
      # newest one is highlighted as "Latest".
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

  # Compile check only (no signing). Turning this into a TestFlight
  # upload needs Apple certs — see docs/RELEASING.md.
  ios-build-check:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
