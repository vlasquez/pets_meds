name: Release

# Manual release. Pick how to bump the version:
#   patch: 1.0.0 -> 1.0.1   (bug-fix release)
#   minor: 1.0.0 -> 1.1.0   (new features)
#   major: 1.0.0 -> 2.0.0   (breaking changes)
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  # Compute the next version, update pubspec, commit and tag.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version
        id: bump
        run: |
          current=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          IFS=. read -r MAJOR MINOR PATCH <<< "$current"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumping $current -> $NEW (${{ inputs.bump }})"

          # versionName + build number (run_number keeps versionCode rising).
          sed -i "s/^version: .*/version: $NEW+${{ github.run_number }}/" pubspec.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "Release v$NEW"
          git tag "v$NEW"
          # Push the version commit (best-effort; a protected branch may
          # reject it) and the tag (used by the GitHub Release).
          git push origin "HEAD:${{ github.ref_name }}" || \
            echo "::warning::Could not push version commit (branch protection?). Tag still created."
          git push origin "v$NEW"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Recreate the upload keystore from secrets. Pass the base64 via
      # env (not string interpolation) and decode tolerantly so any
      # line wrapping in the secret can't corrupt the .jks.
      - name: Set up signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing release secrets. Set ANDROID_KEYSTORE_BASE64"
            echo "::error::and ANDROID_KEYSTORE_PASSWORD in repo Settings →"
            echo "::error::Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks
          if ! keytool -list -keystore android/upload-keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore unreadable — check ANDROID_KEYSTORE_BASE64"
            echo "::error::(no line wrapping) and ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=../upload-keystore.jks
          EOF

      - run: flutter pub get
      # Explicit build-name from the computed version; run_number is a
      # strictly increasing versionCode.
      - run: >-
          flutter build appbundle --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ github.run_number }}
      - run: >-
          flutter build apk --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # Uploads to the Play "internal" track. Promote to production
      # from the Play Console when ready.
      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.the101labs.petmeds
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # Publish a GitHub Release for the new tag, with build artifacts.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

  # Compile check only (no signing). Turning this into a TestFlight
  # upload needs Apple certs — see docs/RELEASING.md.
  ios-build-check:
    needs: [version, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build ios --release --no-codesign
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ github.run_number }}
