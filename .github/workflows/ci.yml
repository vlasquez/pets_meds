name: CI

# Runs on every pull request (and on pushes to main so the branch
# always has a known-good status).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # TODO: set to your local `flutter --version` so CI matches
          # your machine (e.g. 3.32.8). Keeps analyze reproducible.
          flutter-version: 3.32.8
          cache: true
      - run: flutter pub get
      # Errors and warnings block the merge; deprecation infos don't.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
